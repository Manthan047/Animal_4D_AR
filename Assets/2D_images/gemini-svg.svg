<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <!-- 1. Pure White Background -->
  <rect width="1920" height="1080" fill="#FFFFFF" />

  <!-- 2. Minimal Center Branding -->
  <g transform="translate(960, 540)">
    <!-- Minimal Octagonal Icon -->
    <g transform="translate(0, -70)">
      <polygon points="
        -30,-70   30,-70
         70,-30   70,30
         30,70   -30,70
        -70,30   -70,-30" 
        fill="none" 
        stroke="#0F172A" 
        stroke-width="4" />
      
      <!-- Minimalist Inner 'A' Symbol -->
      <path d="M 0 -35 L 22 20 L 10 20 L 0 -10 L -10 20 L -22 20 Z" fill="#0F172A" />
    </g>

    <!-- Company Name -->
    <text x="0" y="70" text-anchor="middle" fill="#0F172A" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="52" font-weight="800" letter-spacing="14">
      AURA INTERACT
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="115" text-anchor="middle" fill="#64748B" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="16" font-weight="600" letter-spacing="10">
      SPATIAL COMPUTING
    </text>
  </g>
</svg>
